<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>El Dios Presidente</title>
  <link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="ui">
    <header id="topbar">
      <div class="brand">EL DIOS PRESIDENTE</div>
      <div class="chips">
        <div id="pesos" class="chip">💰 $0</div>
        <div id="mana" class="chip">✨ 0</div>
        <div id="pop" class="chip">👥 0</div>
        <div id="mood" class="chip">😊</div>
        <div id="clock" class="chip">☀️ Day 1 · 09:00</div>
        <div id="speed" class="chip">▶ 1×</div>
      </div>
    </header>

    <div id="advisor" class="advisor" hidden>
      <div id="advisor-face" class="face"></div>
      <div>
        <div id="advisor-name" class="name"></div>
        <div id="advisor-text" class="text"></div>
      </div>
    </div>

    <div id="inspect" hidden>
      <div id="inspect-icon" class="face"></div>
      <div class="grow">
        <div id="inspect-title" class="name"></div>
        <div id="inspect-sub" class="text"></div>
        <div id="inspect-bars"></div>
      </div>
    </div>

    <div id="toast" hidden></div>
    <footer id="hints"></footer>

    <div id="radial" hidden></div>

    <section id="almanac" hidden>
      <h1>Almanac del Presidente</h1>
      <div id="almanac-cards" class="cards"></div>
    </section>

    <section id="choose" hidden>
      <h1>Choose your Mascota Supremo</h1>
      <div id="choose-cards"></div>
      <p><span class="pill">✚</span> / <span class="pill stick">L</span> Choose &nbsp; <span class="btn cross">✕</span> Hatch the egg</p>
    </section>

    <section id="ending" hidden>
      <div class="title-box">
        <div id="ending-kicker" class="kicker"></div>
        <h1 id="ending-title"></h1>
        <p id="ending-text"></p>
        <p id="ending-hint"></p>
      </div>
    </section>

    <section id="title">
      <div class="title-box">
        <div class="kicker">República Divina de San Milagro · 1961</div>
        <h1>EL DIOS<br>PRESIDENTE</h1>
        <p id="title-status">Press any button on your DualShock 4</p>
      </div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
